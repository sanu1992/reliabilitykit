<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980" role="img" aria-labelledby="title description">
  <title id="title">ReliabilityKit architecture</title>
  <desc id="description">Human users access the browser dashboard or Python CLI. AI agents access the Python tools through a local MCP server and security boundary. All processing remains on the customer laptop with no Kubernetes API, kubeconfig, shell, or arbitrary network access.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#eef7ff"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <style>
      .heading { font: 700 34px "Segoe UI", Inter, Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 17px "Segoe UI", Inter, Arial, sans-serif; fill: #475569; }
      .section { font: 700 18px "Segoe UI", Inter, Arial, sans-serif; fill: #0f172a; }
      .box-title { font: 700 20px "Segoe UI", Inter, Arial, sans-serif; fill: #0f172a; }
      .box-copy { font: 400 15px "Segoe UI", Inter, Arial, sans-serif; fill: #475569; }
      .small { font: 600 13px "Segoe UI", Inter, Arial, sans-serif; fill: #64748b; letter-spacing: 0.5px; }
      .edge { fill: none; stroke: #475569; stroke-width: 2.5; marker-end: url(#arrow); }
      .test-edge { fill: none; stroke: #9333ea; stroke-width: 2.5; stroke-dasharray: 8 7; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1400" height="980" rx="24" fill="url(#background)"/>
  <text x="700" y="55" text-anchor="middle" class="heading">ReliabilityKit architecture</text>
  <text x="700" y="84" text-anchor="middle" class="subtitle">Three SRE workflows, two local implementations, one secure agent interface</text>

  <!-- Actors and local input -->
  <g filter="url(#shadow)">
    <rect x="80" y="115" width="280" height="90" rx="18" fill="#eaf3ff" stroke="#2563eb" stroke-width="2"/>
    <rect x="540" y="115" width="320" height="90" rx="18" fill="#e8fbfa" stroke="#0891b2" stroke-width="2"/>
    <rect x="1040" y="115" width="280" height="90" rx="18" fill="#f2ecff" stroke="#7c3aed" stroke-width="2"/>
  </g>
  <text x="220" y="152" text-anchor="middle" class="box-title">SRE / platform engineer</text>
  <text x="220" y="179" text-anchor="middle" class="box-copy">Human operator</text>
  <text x="700" y="147" text-anchor="middle" class="box-title">Local input</text>
  <text x="700" y="174" text-anchor="middle" class="box-copy">Manifests, SLO numbers, incident facts</text>
  <text x="1180" y="152" text-anchor="middle" class="box-title">AI agent / MCP host</text>
  <text x="1180" y="179" text-anchor="middle" class="box-copy">Structured tool caller</text>

  <!-- Laptop trust boundary -->
  <rect x="50" y="250" width="1300" height="680" rx="26" fill="#ffffff" fill-opacity="0.82" stroke="#0ea5e9" stroke-width="3" stroke-dasharray="12 9"/>
  <rect x="82" y="231" width="335" height="39" rx="19" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="2"/>
  <text x="249" y="257" text-anchor="middle" class="section">Customer laptop — local trust boundary</text>
  <text x="700" y="286" text-anchor="middle" class="small">ENTRY POINTS</text>

  <!-- Entry points -->
  <g filter="url(#shadow)">
    <rect x="110" y="310" width="330" height="110" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <rect x="535" y="310" width="330" height="110" rx="18" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
    <rect x="960" y="310" width="330" height="110" rx="18" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  </g>
  <text x="275" y="352" text-anchor="middle" class="box-title">Browser dashboard</text>
  <text x="275" y="381" text-anchor="middle" class="box-copy">React + TypeScript</text>
  <text x="700" y="352" text-anchor="middle" class="box-title">Command-line interface</text>
  <text x="700" y="381" text-anchor="middle" class="box-copy">Python</text>
  <text x="1125" y="352" text-anchor="middle" class="box-title">MCP server</text>
  <text x="1125" y="381" text-anchor="middle" class="box-copy">Local stdio only</text>

  <!-- Domain and security layer -->
  <g filter="url(#shadow)">
    <rect x="110" y="515" width="330" height="140" rx="18" fill="#e8f7f4" stroke="#0f766e" stroke-width="2"/>
    <rect x="535" y="515" width="330" height="140" rx="18" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
    <rect x="960" y="475" width="330" height="150" rx="18" fill="#fff7e6" stroke="#d97706" stroke-width="2"/>
  </g>
  <text x="275" y="557" text-anchor="middle" class="box-title">Browser domain modules</text>
  <text x="275" y="590" text-anchor="middle" class="box-copy">Manifest audit · SLO calculator</text>
  <text x="275" y="616" text-anchor="middle" class="box-copy">Postmortem generator</text>
  <text x="700" y="557" text-anchor="middle" class="box-title">Python domain modules</text>
  <text x="700" y="590" text-anchor="middle" class="box-copy">Manifest audit · SLO calculator</text>
  <text x="700" y="616" text-anchor="middle" class="box-copy">Postmortem generator</text>
  <text x="1125" y="513" text-anchor="middle" class="box-title">Agent security boundary</text>
  <text x="1125" y="545" text-anchor="middle" class="box-copy">Schema validation · allowed roots</text>
  <text x="1125" y="571" text-anchor="middle" class="box-copy">File and byte limits · redaction</text>
  <text x="1125" y="597" text-anchor="middle" class="box-copy">Sanitized structured results</text>

  <!-- Contract and output -->
  <g filter="url(#shadow)">
    <rect x="180" y="735" width="520" height="105" rx="18" fill="#faf5ff" stroke="#9333ea" stroke-width="2"/>
    <rect x="890" y="735" width="330" height="105" rx="18" fill="#ecfdf3" stroke="#16a34a" stroke-width="2"/>
  </g>
  <text x="440" y="776" text-anchor="middle" class="box-title">Shared golden contract</text>
  <text x="440" y="806" text-anchor="middle" class="box-copy">tests/golden/cases.json keeps both runtimes aligned</text>
  <text x="1055" y="776" text-anchor="middle" class="box-title">Local results</text>
  <text x="1055" y="806" text-anchor="middle" class="box-copy">Dashboard · terminal · JSON · Markdown</text>

  <!-- Explicit non-capabilities -->
  <rect x="285" y="872" width="830" height="40" rx="20" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/>
  <text x="700" y="898" text-anchor="middle" style="font: 700 15px 'Segoe UI', Inter, Arial, sans-serif; fill: #be123c;">No Kubernetes API · no kubeconfig · no shell · no arbitrary network access</text>

  <!-- External-to-entry arrows -->
  <path d="M220 205 V230 H275 V309" class="edge"/>
  <path d="M220 205 V230 H700 V309" class="edge"/>
  <path d="M1180 205 V309" class="edge"/>
  <path d="M700 205 V309" class="edge"/>
  <path d="M700 225 H465 V285 H275 V309" class="edge"/>
  <path d="M700 225 H935 V285 H1125 V309" class="edge"/>

  <!-- Runtime flow arrows -->
  <path d="M275 420 V514" class="edge"/>
  <path d="M700 420 V514" class="edge"/>
  <path d="M1125 420 V474" class="edge"/>
  <path d="M960 575 H910 V585 H866" class="edge"/>
  <path d="M440 735 V695 H275 V656" class="test-edge"/>
  <path d="M440 735 V695 H700 V656" class="test-edge"/>
  <path d="M440 655 V690 H1055 V734" class="edge"/>
  <path d="M700 655 V690 H1055 V734" class="edge"/>
</svg>
