apiVersion: v1
kind: Secret
metadata:
  name: payment-credentials
  namespace: storefront
stringData:
  password: should-never-appear-in-a-report
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-api
  namespace: storefront
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: payment-api
  template:
    metadata:
      labels:
        app: payment-api
    spec:
      containers:
        - name: api
          image: registry.example.com/payment-api:latest

